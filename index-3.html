function todayISO(){return new Date().toISOString().slice(0,10)}
function formatDateFR(v){if(!v)return '';const d=new Date(v+'T00:00:00');return Number.isNaN(d.getTime())?'':d.toLocaleDateString('fr-FR',{day:'2-digit',month:'long',year:'numeric'})}
function normalizeHeader(v){return String(v||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^a-z0-9]/g,'')}
function parseCSVLine(line,sep){const out=[];let cur='',quoted=false;for(let i=0;i<line.length;i++){const ch=line[i];if(ch==='\"'){if(quoted&&line[i+1]==='\"'){cur+='\"';i++;}else quoted=!quoted;}else if(ch===sep&&!quoted){out.push(cur.trim());cur='';}else cur+=ch;}out.push(cur.trim());return out;}

function save(){localStorage.setItem(KEY,JSON.stringify(db));localStorage.setItem(SYNC_PENDING_KEY,'1');}
function esc(x){return String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function id(prefix){return prefix+'-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,7)}
const SESSION_KEY='school_pilot_keur_madiagne_session';
function logoutLocal(){localStorage.removeItem(SESSION_KEY);showLockScreen();}
function loginLocal(){localStorage.setItem(SESSION_KEY,'1');location.reload();}
function showLockScreen(){document.body.innerHTML=`<div class="lockscreen"><div class="lockcard"><div style="font-size:42px">🇸🇳</div><h2>SCHOOL PILOT</h2><p>Session déconnectée.<br>Les données de l'école restent conservées.</p><button class="btn primary" onclick="loginLocal()">↪ Reprendre la session</button></div></div>`}

const menus=[['dashboard','🏠','Tableau de bord'],['students','👥','Élèves'],['teachers','👨‍🏫','Enseignants'],['classes','🏫','Classes'],['attendance','🕐','Présences'],['grades','📚','Évaluations & bulletins'],['finance','💰','Finances & caisse'],['inventory','🪑','Mobilier'],['infra','🏗️','Infrastructures'],['manuals','📖','Manuels'],['villages','🏘️','Villages'],['documents','📄','Documents'],['reports','📊','Rapports & statistiques'],['calendar','📅','Calendrier'],['settings','⚙️','Paramètres']];
function nav(){document.getElementById('nav').innerHTML=menus.map(m=>`<button data-icon="${m[1]}" class="${current===m[0]?'active':''}" onclick="show('${m[0]}')">${m[1]} ${m[2]}</button>`).join('')}
function show(s){current=s;nav();render()}
function render(){document.getElementById('title').textContent=menus.find(m=>m[0]===current)?.[2]||'Tableau de bord'; document.getElementById('sections').innerHTML=views[current](); if(current==='students') renderStudentTable();}
function ageAtDate(dob, ref=todayISO()){
  if(!dob)return null;
  const d=new Date(String(dob)+'T00:00:00'), r=new Date(String(ref)+'T00:00:00');
  if(Number.isNaN(d.getTime())||Number.isNaN(r.getTime())||d>r)return null;
  let age=r.getFullYear()-d.getFullYear();
  const beforeBirthday=(r.getMonth()<d.getMonth())||(r.getMonth()===d.getMonth()&&r.getDate()<d.getDate());
  if(beforeBirthday)age--;
  return age>=0&&age<=30?age:null;
}
function ageTableDashboard(){
  const classes=db.classes||[];
  const ages=[...new Set(db.students.map(s=>ageAtDate(s.dob)).filter(a=>a!==null))].sort((a,b)=>a-b);
  const rows=ages.map(age=>{
    let tg=0,tf=0;
    const cells=classes.map(c=>{
      const arr=db.students.filter(s=>s.className===c&&ageAtDate(s.dob)===age);
      const g=arr.filter(s=>s.sex==='M').length, f=arr.filter(s=>s.sex==='F').length; tg+=g; tf+=f;
      return `<td>${g}</td><td>${f}</td><td><b>${g+f}</b></td>`;
    }).join('');
    return `<tr><td><b>${age} ans</b></td>${cells}<td class="village-total">${tg}</td><td class="village-total">${tf}</td><td class="village-total">${tg+tf}</td></tr>`;
  });
  const unknown=db.students.filter(s=>ageAtDate(s.dob)===null);
  if(unknown.length){
    let tg=0,tf=0;
    const cells=classes.map(c=>{const arr=unknown.filter(s=>s.className===c);const g=arr.filter(s=>s.sex==='M').length,f=arr.filter(s=>s.sex==='F').length;tg+=g;tf+=f;return `<td>${g}</td><td>${f}</td><td><b>${g+f}</b></td>`}).join('');
    rows.push(`<tr><td><b>Âge non renseigné</b></td>${cells}<td class="village-total">${tg}</td><td class="village-total">${tf}</td><td class="village-total">${tg+tf}</td></tr>`);
  }
  if(!rows.length)return '<p>Aucune date de naissance renseignée.</p>';
  return `<div class="card col-12"><h3>🎂 Répartition des élèves par âge, classe et sexe</h3><p><small>Âge calculé automatiquement à partir de la date de naissance, au ${esc(formatDateFR(todayISO()))}.</small></p><div class="tablewrap"><table class="table village-table"><tr><th>Âge</th>${classes.map(c=>`<th colspan="3">${esc(c)}</th>`).join('')}<th colspan="3" class="village-total">TOTAL</th></tr><tr><th></th>${classes.map(()=>'<th>G</th><th>F</th><th>Total</th>').join('')}<th class="village-total">G</th><th class="village-total">F</th><th class="village-total">Total</th></tr>${rows.join('')}</table></div></div>`;
}

async function importCSV(file){
if(!file)return;
try{
  const isXlsx=/\.xlsx$/i.test(file.name)||file.type==='application/vnd.openxmlformats-officedocument.spreadsheetml.sheet';
  const rows=isXlsx?await readXLSX(file):readCSVText(await file.text());
  previewStudentImport(rows,file.name);
}catch(e){console.error(e);alert('Import impossible : '+(e?.message||'le fichier n’a pas pu être lu.')+' Vous pouvez essayer un fichier XLSX valide ou CSV UTF-8.');}
}
function readCSVText(text){
  text=String(text||'').replace(/^\uFEFF/,'');
  const lines=text.split(/\r?\n/).filter(x=>x.trim());
  if(!lines.length)throw new Error('fichier vide');
  const h=lines[0]; const sep=h.includes(';')?';':(h.includes('\t')?'\t':',');
  return lines.map(line=>parseCSVLine(line,sep));
}
async function readXLSX(file){

  let eocd=-1; for(let i=bytes.length-22;i>=Math.max(0,bytes.length-65557);i--){if(u32(i)===0x06054b50){eocd=i;break;}}
  if(eocd<0)throw new Error('fichier XLSX non reconnu');

    if(u32(pos)!==0x02014b50)throw new Error('structure XLSX invalide');
    const method=u16(pos+10), csize=u32(pos+20), usize=u32(pos+24), nlen=u16(pos+28), xlen=u16(pos+30), clen=u16(pos+32), loff=u32(pos+42);
    const name=dec.decode(bytes.slice(pos+46,pos+46+nlen)); entries[name]={method,csize,usize,loff}; pos+=46+nlen+xlen+clen;
  }
  async function unzip(name){
    const e=entries[name]; if(!e)throw new Error('Élément XLSX manquant : '+name);
    const lo=e.loff, nlen=u16(lo+26), xlen=u16(lo+28), data=bytes.slice(lo+30+nlen+xlen,lo+30+nlen+xlen+e.csize);
    if(e.method===0)return data;
    if(e.method===8&&typeof DecompressionStream==='function'){

      return new Uint8Array(await new Response(new Blob([data]).stream().pipeThrough(ds)).arrayBuffer());
    }
    throw new Error('Compression XLSX non supportée par ce navigateur');
  }
  const xml=new TextDecoder('utf-8');

  if(entries['xl/sharedStrings.xml']){
    const d=new DOMParser().parseFromString(xml.decode(await unzip('xl/sharedStrings.xml')),'application/xml');
    d.querySelectorAll('si').forEach(si=>shared.push(Array.from(si.querySelectorAll('t')).map(x=>x.textContent).join('')));
  }
  const wb=new DOMParser().parseFromString(xml.decode(await unzip('xl/workbook.xml')),'application/xml');
  const rels=new DOMParser().parseFromString(xml.decode(await unzip('xl/_rels/workbook.xml.rels')),'application/xml');
  const relMap={}; rels.querySelectorAll('Relationship').forEach(r=>relMap[r.getAttribute('Id')]=r.getAttribute('Target'));
  const sheet=wb.querySelector('sheet'); if(!sheet)throw new Error('Aucune feuille Excel trouvée');
  const rid=sheet.getAttribute('r:id')||sheet.getAttributeNS('http://schemas.openxmlformats.org/officeDocument/2006/relationships','id');
  let target=relMap[rid]; if(!target)throw new Error('Feuille Excel introuvable');
  target=target.replace(/^\//,''); if(!target.startsWith('xl/'))target='xl/'+target.replace(/^\.\//,'');
  const sd=new DOMParser().parseFromString(xml.decode(await unzip(target)),'application/xml');
  const out=[];
  sd.querySelectorAll('sheetData > row').forEach(row=>{
    const vals=[];
    row.querySelectorAll(':scope > c').forEach(c=>{
      const ref=c.getAttribute('r')||''; const letters=(ref.match(/[A-Z]+/i)||['A'])[0].toUpperCase(); let col=0; for(const ch of letters)col=col*26+ch.charCodeAt(0)-64; col--;
      while(vals.length<=col)vals.push('');
      const t=c.getAttribute('t'), v=c.querySelector('v'), is=c.querySelector('is'); let val='';
      if(t==='s'&&v)val=shared[Number(v.textContent)]??'';
      else if(t==='inlineStr'&&is)val=Array.from(is.querySelectorAll('t')).map(x=>x.textContent).join('');
      else if(t==='b'&&v)val=v.textContent==='1'?'TRUE':'FALSE';
      else if(v)val=v.textContent;
      else if(is)val=Array.from(is.querySelectorAll('t')).map(x=>x.textContent).join('');
      vals[col]=val;
    }); out.push(vals);
  });
  return out;
}
function importHeaderInfo(rows){

  const find=(...names)=>{for(const n of names){const i=rawHeaders.indexOf(normalizeHeader(n));if(i>=0)return i;}return -1};
  return {rawHeaders, iFirst:find('prenom','prénom','prénoms','prenoms','firstname'), iLast:find('nom','name','lastname'), iSex:find('sexe','sex','genre'), iClass:find('classe','class','classe scolaire'), idx:{dob:find('date naissance','datenaissance','date de naissance','dob','naissance'),village:find('village'),phone:find('telephone','téléphone','phone'),parent:find('parent','tuteur','parent tuteur')}};
}
function normalizeImportSex(raw){const s=String(raw||'').trim().normalize('NFD').replace(/[\u0300-\u036f]/g,'').toUpperCase();if(['F','FILLE','FILLES','FEMININ','FEMME','FEMALE'].includes(s))return 'F';if(['M','G','GARCON','GARCONS','MASCULIN','HOMME','MALE'].includes(s))return 'M';return '';}

  window.pendingStudentImport={rows,filename,rowsPreview};
  modal(`<h3>Prévisualisation — ${esc(filename)}</h3><div class="notice"><b>${rowsPreview.length}</b> ligne(s) détectée(s) · <b>${valid}</b> valide(s) · <b>${warn}</b> à compléter · <b>${dup}</b> doublon(s). Aucun élève n'est encore enregistré.</div>${rowsPreview.length>100?'<p><small>Aperçu limité aux 100 premières lignes. Le fichier complet sera traité à la confirmation.</small></p>':''}${table}<div class="actions" style="margin-top:14px"><button type="button" class="btn" onclick="closeModal();document.getElementById('csv')?.value=''">✕ Annuler</button><button type="button" class="btn primary" onclick="confirmStudentImport()">✓ Confirmer l'import</button></div>`);

const SYNC_URL_KEY='school_pilot_sync_url';
const SYNC_TOKEN_KEY='school_pilot_sync_token';
const SYNC_KEY_KEY='school_pilot_sync_key';
const SYNC_REV_KEY='school_pilot_sync_revision';
const SYNC_PENDING_KEY='school_pilot_sync_pending';
function syncConfig(){return {url:(localStorage.getItem(SYNC_URL_KEY)||'').replace(/\/$/,''),token:localStorage.getItem(SYNC_TOKEN_KEY)||'',key:localStorage.getItem(SYNC_KEY_KEY)||''}}
function syncHeaders(){const c=syncConfig();const h={'Content-Type':'application/json'};if(c.key)h['X-SP-SYNC-KEY']=c.key;if(c.token)h.Authorization='Bearer '+c.token;return h}
async function syncNow(){
 const c=syncConfig();
 if(!c.url||!c.key)return syncSettingsPrompt();
 if(!navigator.onLine){localStorage.setItem(SYNC_PENDING_KEY,'1');return alert('Hors connexion : les données restent enregistrées sur cet appareil. La synchronisation sera reprise dès que la connexion revient.')}
 try{
  let r=await fetch(c.url+'/api/state',{headers:syncHeaders()});
  if(r.status===404)r=await fetch(c.url+'/api/sync/state',{headers:syncHeaders()});
  if(r.status===401)throw new Error('CLÉ_DE_SYNCHRONISATION_INVALIDE');
  if(!r.ok)throw new Error('SERVEUR_INDISPONIBLE');
  const remote=await r.json();
  const remoteRevision=Number(remote.revision||remote.currentRevision||0);
  const localRevision=Number(localStorage.getItem(SYNC_REV_KEY)||0);
  if(remoteRevision>localRevision && remote.data){
    if(!confirm('Une version plus récente existe sur le serveur (révision '+remoteRevision+'). Voulez-vous la récupérer sur cet appareil ?'))return;
    db=remote.data;save();localStorage.setItem(SYNC_REV_KEY,String(remoteRevision));localStorage.removeItem(SYNC_PENDING_KEY);render();return alert('Synchronisation terminée : données du serveur récupérées.');
  }
  const body={data:db,baseRevision:localRevision,expectedRevision:localRevision,device:navigator.userAgent.slice(0,160),clientId:localStorage.getItem('school_pilot_client_id')||('client-'+Math.random().toString(36).slice(2))};
  localStorage.setItem('school_pilot_client_id',body.clientId);
  r=await fetch(c.url+'/api/state',{method:'PUT',headers:syncHeaders(),body:JSON.stringify(body)});
  if(r.status===404)r=await fetch(c.url+'/api/sync/state',{method:'PUT',headers:syncHeaders(),body:JSON.stringify(body)});
  if(r.status===409){localStorage.setItem(SYNC_PENDING_KEY,'1');return alert('Conflit de synchronisation : une version plus récente est déjà sur le serveur. Relancez Synchroniser pour la récupérer.')}
  if(r.status===401)throw new Error('CLÉ_DE_SYNCHRONISATION_INVALIDE');
  if(!r.ok)throw new Error('ECHEC_ENVOI');
  const out=await r.json();localStorage.setItem(SYNC_REV_KEY,String(out.revision||localRevision+1));localStorage.removeItem(SYNC_PENDING_KEY);alert('Synchronisation terminée avec succès. Révision serveur : '+(out.revision||localRevision+1));
 }catch(e){localStorage.setItem(SYNC_PENDING_KEY,'1');alert('Synchronisation impossible pour le moment. Les données locales sont conservées.\n\n'+e.message)}
}
function syncSettingsPrompt(){
 const url=prompt('Adresse du serveur SCHOOL PILOT :',localStorage.getItem(SYNC_URL_KEY)||'https://school-pilot-api.onrender.com'); if(!url)return;
 const key=prompt('Clé secrète SCHOOL_PILOT_SYNC_KEY :'); if(!key)return;
 localStorage.setItem(SYNC_URL_KEY,url.replace(/\/$/,''));localStorage.setItem(SYNC_KEY_KEY,key);showSyncSettings();
}
function showSyncSettings(){
 const c=syncConfig();modal(`<h3>🔄 Synchronisation multi-appareils</h3><p class="notice">Les données peuvent être synchronisées entre téléphone, tablette et ordinateur via le serveur central.</p><div class="formgrid"><div class="field full"><label>Adresse du serveur</label><input id="syncUrl" value="${esc(c.url)}" placeholder="https://..." /></div><div class="field full"><label>Clé de synchronisation</label><input id="syncKey" type="password" value="${esc(c.key)}" placeholder="Clé secrète" /></div><div class="field full"><label>Révision locale</label><input value="${esc(localStorage.getItem(SYNC_REV_KEY)||'0')}" readonly /></div></div><div class="actions" style="margin-top:14px"><button class="btn primary" onclick="saveSyncSettings()">Enregistrer</button><button class="btn" onclick="closeModal();syncNow()">🔄 Synchroniser maintenant</button></div>`)
}
